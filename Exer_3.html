<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseFloat(prompt("Digite o primeiro número inteiro: "))

        switch(true)
        {
            case (n === 0): alert("O número é igual a zero."); break;
            case (n < 0): alert("O número é negativo."); break;
            case (n > 0): alert("O número é positivo"); break;
        }
    </script>
</body>
</html>
